org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# --------------------------------------------------------------------------
# Every version the launcher build needs is declared here and nowhere else,
# the same convention the mod build follows.
#
# Kotlin and the Compose compiler plugin must stay on the same version: since
# Kotlin 2.0 the Compose compiler ships inside the Kotlin release. Compose
# Multiplatform itself is versioned separately.
# --------------------------------------------------------------------------
kotlin_version=2.4.20
compose_version=1.9.3
serialization_version=1.11.0
coroutines_version=1.11.0
junit_version=5.14.4

java_version=25

launcher_version=0.1.0
maven_group=dev.survivaloverhaul.launcher

# jpackage refuses a Windows MSI whose version starts with 0, so the installer
# version is tracked separately from the version the launcher reports about
# itself. Bump both together.
package_version=1.0.0
