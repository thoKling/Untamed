org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Loom is not yet compatible with the configuration cache.
org.gradle.configuration-cache=false

# --------------------------------------------------------------------------
# Version coordinates, resolved from meta.fabricmc.net and the Fabric maven.
#
# Yarn mappings are not published for the 26.x line. Loom now uses Minecraft's
# official mappings by default, which is why no mappings dependency is declared.
# --------------------------------------------------------------------------
minecraft_version=26.2
loader_version=0.19.5
fabric_api_version=0.160.0+26.2
loom_version=1.17.20

java_version=25

mod_version=0.1.0
maven_group=dev.survivaloverhaul
archives_base_name=survivaloverhaul
